# goreleaser config for chippy.
# https://goreleaser.com
#
# Tag scheme: chippy keeps the bare `vX.Y.Z` scheme it shipped with at
# v1.0.0. nessy ships under `nessy-vX.Y.Z` via a custom workflow path —
# goreleaser OSS doesn't support monorepo tag prefixes (pro-only), so
# the workflow gates jobs on `startsWith(github.ref_name, 'nessy-')`
# instead. See `docs/RELEASE.md`.
version: 2

project_name: chippy

before:
  hooks:
    - go mod tidy

builds:
  - id: chippy
    main: ./cmd/chippy
    binary: chippy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath strips absolute repo paths from the binary so the build
    # is path-independent; -buildvcs=true stamps the commit + dirty bit
    # into debug.BuildInfo (verifiable via `go version -m chippy`).
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

# Keyless cosign signing via the GitHub Actions OIDC identity. No
# private key — the signature is bound to the workflow that produced
# it. Verify with:
#   cosign verify-blob \
#     --certificate-identity=https://github.com/nkane/chippy/.github/workflows/release.yml@refs/tags/<TAG> \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#     --bundle <ASSET>.cosign.bundle <ASSET>
signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

# Software Bill of Materials (SBOM). Generates one SPDX file per
# archive via syft, attached to the GitHub Release.
sboms:
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Other changes'
      order: 999

# Linux package distribution (issue #118). nfpms produces .deb / .rpm
# / .apk per archived build; attached to the GitHub release alongside
# the tarballs and the cosign + SBOM artifacts. AUR PKGBUILD is filed
# from the produced tarballs (the `aurs:` block below).
nfpms:
  - id: linux-packages
    package_name: chippy
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: "https://github.com/nkane/chippy"
    description: "TUI 6502 emulator + ca65/cc65 source-level debugger"
    maintainer: "Nick Kane <nkanedev@gmail.com>"
    license: MIT
    vendor: nkane
    section: devel
    priority: optional
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: ./README.md
        dst: /usr/share/doc/chippy/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/chippy/LICENSE

# AUR (Arch User Repository) bin package. Pulls the tarball goreleaser
# already uploads to the GitHub release. The PR body in SECURITY.md
# documents the cosign verify path that downstream packagers use.
aurs:
  - name: chippy-bin
    homepage: "https://github.com/nkane/chippy"
    description: "TUI 6502 emulator + ca65/cc65 source-level debugger"
    maintainers:
      - "Nick Kane <nkanedev at gmail dot com>"
    license: MIT
    private_key: "{{ .Env.AUR_SSH_PRIVATE_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/chippy-bin.git"
    package: |-
      install -Dm755 chippy "${pkgdir}/usr/bin/chippy"
      install -Dm644 README.md "${pkgdir}/usr/share/doc/chippy/README.md"
      install -Dm644 LICENSE "${pkgdir}/usr/share/doc/chippy/LICENSE"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "aur: bump chippy-bin to {{ .Tag }}"
    skip_upload: auto

# Homebrew distribution. goreleaser deprecated `brews:` (formulae) in favour
# of `homebrew_casks:` (#413) — Homebrew now expects casks for pre-built
# binaries. The cask carries a post-install hook that clears the macOS
# quarantine xattr: the binary is cosign-signed but not Apple-notarized, so
# Gatekeeper would otherwise quarantine it on first launch.
homebrew_casks:
  - name: chippy
    binaries: [chippy]
    repository:
      owner: nkane
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/nkane/chippy"
    description: "TUI 6502 emulator + ca65/cc65 source-level debugger"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew: bump {{ .ProjectName }} to {{ .Tag }}"
    directory: Casks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/chippy"]
          end

release:
  github:
    owner: nkane
    name: chippy
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## chippy {{ .Tag }}

    A TUI 6502 emulator with a ca65/cc65 source-level debugger.
  footer: |
    ---
    **Install via Homebrew**
    ```
    brew tap nkane/tap
    brew install --cask chippy
    ```

    **Or download a binary** from the assets below and drop it on your `$PATH`.
