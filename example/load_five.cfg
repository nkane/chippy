# Minimal ld65 config for a flat 64KB 6502 image.
#
# Layout:
#   $8000-$FFF9  CODE  (program bytes)
#   $FFFA-$FFFF  VECTORS (NMI, RESET, IRQ)
#
# Output is a raw binary the size of the MEMORY region, so chippy can load it
# straight into RAM with the bytes ending up at the right physical addresses.

MEMORY {
    ROM: start = $8000, size = $8000, fill = yes, fillval = $00, file = %O;
}

SEGMENTS {
    CODE:    load = ROM, type = ro, start = $8000;
    VECTORS: load = ROM, type = ro, start = $FFFA;
}
