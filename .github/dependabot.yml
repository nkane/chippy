version: 2
updates:
  # Go module dependencies
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: scope

  # VS Code extension npm dependencies
  - package-ecosystem: npm
    directory: /extension/vscode-chippy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      ext-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      include: scope
