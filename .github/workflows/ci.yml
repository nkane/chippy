name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build ./...

      - name: go test
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  klaus:
    name: klaus + allsuite cpu tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Assemble Klaus interrupt test ROM (cc65)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cc65
          cd cpu/testdata
          ca65 6502_interrupt_test.ca65 -o irq.o
          ld65 irq.o -o 6502_interrupt_test.bin -C interrupt_test.cfg
          rm -f irq.o

      - name: Run Klaus functional + interrupt tests + AllSuiteA smoke ROM
        env:
          CHIPPY_INTERRUPT_BIN: ${{ github.workspace }}/cpu/testdata/6502_interrupt_test.bin
        run: go test -tags=klaus -timeout 5m -run 'TestKlaus|TestAllSuiteA' -v ./cpu/...

  lorenz:
    name: wolfgang lorenz suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run Wolfgang Lorenz CPU subset
        run: go test -tags=lorenz -timeout 5m -run TestLorenzSuite -v ./cpu/...

  tomharte:
    name: tom harte tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      # Tom Harte's 6502 set is ~1 GB; cache it keyed on the pinned commit so
      # it downloads at most once.
      - name: Cache Tom Harte 6502 data
        id: harte-cache
        uses: actions/cache@v5
        with:
          path: harte-data
          key: harte-6502-bb117564

      - name: Download Tom Harte 6502 data
        if: steps.harte-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p harte-data
          base="https://raw.githubusercontent.com/TomHarte/ProcessorTests/bb11756436da8fd16cce86aef63dc6725f48836f/6502/v1"
          seq 0 255 | xargs -P 8 -I {} sh -c 'op=$(printf "%02x" {}); curl -sfL "'"$base"'/$op.json" -o "harte-data/$op.json"'

      - name: Run Tom Harte 6502 per-opcode tests (state + bus trace)
        env:
          CHIPPY_HARTE_DIR: ${{ github.workspace }}/harte-data
        run: go test -tags=harte -timeout 5m -run TestHarte6502 -v ./cpu/...

      # WDC 65C02 set (CMOS variant, #426), cached + run the same way.
      - name: Cache Tom Harte 65C02 data
        id: harte-cache-65c02
        uses: actions/cache@v5
        with:
          path: harte-data-65c02
          key: harte-wdc65c02-bb117564

      - name: Download Tom Harte 65C02 data
        if: steps.harte-cache-65c02.outputs.cache-hit != 'true'
        run: |
          mkdir -p harte-data-65c02
          base="https://raw.githubusercontent.com/TomHarte/ProcessorTests/bb11756436da8fd16cce86aef63dc6725f48836f/wdc65c02/v1"
          seq 0 255 | xargs -P 8 -I {} sh -c 'op=$(printf "%02x" {}); curl -sfL "'"$base"'/$op.json" -o "harte-data-65c02/$op.json"'

      - name: Run Tom Harte 65C02 per-opcode tests (state + cycle count)
        env:
          CHIPPY_HARTE_65C02_DIR: ${{ github.workspace }}/harte-data-65c02
        run: go test -tags=harte -timeout 5m -run TestHarte65C02 -v ./cpu/...

      # WDC 65C816 set (#456). Newer pin than 6502/65C02, split per mode
      # (<op>.e.json / <op>.n.json). The core is built incrementally, so
      # download only the implemented opcodes rather than the full 512-file
      # corpus. Validates final state + cycle count.
      - name: Cache Tom Harte 65816 data
        id: harte-cache-65816
        uses: actions/cache@v5
        with:
          path: harte-data-65816
          key: harte-wdc65816-dff67125-chunk3

      - name: Download Tom Harte 65816 implemented-opcode data
        if: steps.harte-cache-65816.outputs.cache-hit != 'true'
        run: |
          mkdir -p harte-data-65816
          base="https://raw.githubusercontent.com/TomHarte/ProcessorTests/dff67125c4aa0a15f928769b7cbc85b2ead6c6ad/65816/v1"
          # chunk 1: register/flag/transfer/immediate
          ops="ea 18 38 58 78 d8 f8 b8 e8 ca c8 88 1a 3a aa a8 ba 8a 98 9a 9b bb 5b 7b 1b 3b eb a9 a2 a0 29 09 49 c9 e0 c0 89 fb e2 c2"
          # chunk 2: data-movement / ALU memory ops (all addressing modes)
          ops="$ops 01 03 05 07 0d 0f 11 12 13 15 17 19 1d 1f 21 23 25 27 2d 2f 31 32 33 35 37 39 3d 3f"
          ops="$ops 41 43 45 47 4d 4f 51 52 53 55 57 59 5d 5f 61 63 65 67 69 6d 6f 71 72 73 75 77 79 7d 7f"
          ops="$ops 81 83 85 87 8d 8f 91 92 93 95 97 99 9d 9f a1 a3 a5 a7 ad af b1 b2 b3 b5 b7 b9 bd bf"
          ops="$ops c1 c3 c5 c7 cd cf d1 d2 d3 d5 d7 d9 dd df e1 e3 e5 e7 e9 ed ef f1 f2 f3 f5 f7 f9 fd ff"
          ops="$ops a6 ae b6 be a4 ac b4 bc 86 8e 96 84 8c 94 64 74 9c 9e e4 ec c4 cc 24 2c 34 3c"
          # chunk 3: RMW / stack / control flow (MVN/MVP $44/$54 still pending)
          ops="$ops 0a 06 0e 16 1e 4a 46 4e 56 5e 2a 26 2e 36 3e 6a 66 6e 76 7e"
          ops="$ops e6 ee f6 fe c6 ce d6 de 04 0c 14 1c"
          ops="$ops 48 68 da fa 5a 7a 08 28 8b ab 4b 0b 2b f4 d4 62"
          ops="$ops 4c 5c 6c 7c dc 20 22 fc 60 6b 40 10 30 50 70 90 b0 d0 f0 80 82 00 02 42 cb db"
          for op in $ops; do
            for mode in e n; do
              curl -sfL "$base/$op.$mode.json" -o "harte-data-65816/$op.$mode.json"
            done
          done

      - name: Run Tom Harte 65816 per-opcode tests (state + cycle count)
        env:
          CHIPPY_HARTE_65816_DIR: ${{ github.workspace }}/harte-data-65816
        run: go test -tags=harte -timeout 5m -run TestHarte65816 -v ./cpu/...

  dap-integration:
    name: dap integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run DAP end-to-end stdio session
        run: go test -tags=integration -race -timeout 2m -run TestIntegration -v ./dap/...

  decimal:
    name: exhaustive BCD test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run exhaustive decimal-mode test (Bruce Clark Appendix B)
        run: go test -tags=decimal -timeout 2m -run TestDecimal -v ./cpu/...

  perfgate:
    name: perf baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run perf gate
        run: go test -tags=perfgate -timeout 5m -run TestPerfGate -v ./cpu/...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build chippy.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /tmp/chippy.wasm ./cmd/chippy-wasm

  smoke:
    # VHS-driven smoke tests under test/smoke/. Each .tape script runs
    # chippy end-to-end through a real TTY (via ttyd) and renders a
    # GIF. CI only checks that vhs exited 0 — i.e. the tape didn't
    # crash mid-render. On PRs, the rendered GIFs are pushed to a
    # `smoke-gifs` orphan branch under `pr-<num>/` and embedded into a
    # sticky PR comment, so reviewers see the latest renders inline
    # without downloading artifacts. Each subsequent run for the same
    # PR overwrites that directory (keep_files: false) and updates
    # the comment in place.
    #
    name: vhs smoke (chippy)
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push to smoke-gifs branch
      pull-requests: write  # post/update sticky comment
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install ttyd + ffmpeg + cc65 (vhs deps + ROM builder)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cc65
          # ttyd ships a static binary; apt's package is stale.
          curl -sSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd
          ttyd --version

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@v0.11.0

      - name: Build chippy
        run: go build -o chippy ./cmd/chippy

      - name: Build example ROMs (gitignored — tapes load count_to_ten.bin)
        run: make -C example count_to_ten.bin

      - name: Render smoke tapes
        run: make -C test/smoke chippy

      - name: Upload rendered GIFs + MP4s (workflow artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chippy-smoke-gifs
          path: |
            test/smoke/out/*.gif
            test/smoke/out/*.mp4
          if-no-files-found: error

      # ---- PR-only: publish GIFs + post sticky comment ----
      # Forks can't push back; skip publishing for them. The artifact
      # upload above still works on fork PRs as a fallback.
      - name: Publish GIFs to smoke-gifs branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: smoke-gifs
          publish_dir: ./test/smoke/out
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: false  # overwrite this PR's dir on every run; other PRs untouched
          commit_message: "smoke: render pr-${{ github.event.pull_request.number }} (${{ github.sha }})"
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Post / update sticky PR comment with GIFs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: smoke-gifs
          message: |
            ## TUI smoke renders

            Rendered from ${{ github.sha }} by the `smoke` CI job. Replaced on every push to this PR.

            ### chippy-source-scroll (#227)
            ![chippy-source-scroll](https://raw.githubusercontent.com/${{ github.repository }}/smoke-gifs/pr-${{ github.event.pull_request.number }}/chippy-source-scroll.gif)

            ### chippy-syms (#226)
            ![chippy-syms](https://raw.githubusercontent.com/${{ github.repository }}/smoke-gifs/pr-${{ github.event.pull_request.number }}/chippy-syms.gif)

            ### chippy-bp-and-run (#225)
            ![chippy-bp-and-run](https://raw.githubusercontent.com/${{ github.repository }}/smoke-gifs/pr-${{ github.event.pull_request.number }}/chippy-bp-and-run.gif)

            ### chippy-console (#232)
            ![chippy-console](https://raw.githubusercontent.com/${{ github.repository }}/smoke-gifs/pr-${{ github.event.pull_request.number }}/chippy-console.gif)

  cmos-e2e:
    name: cmos e2e demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cc65 toolchain
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build example/cmos_demo.bin
        run: make -C example cmos_demo.bin

      - name: Run CMOS demo end-to-end test
        env:
          CHIPPY_CMOS_E2E_STRICT: "1"
        run: go test -v -run TestCMOSDemo ./cpu/...
