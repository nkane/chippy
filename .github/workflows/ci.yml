name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build ./...

      - name: go test
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  nessy-build:
    # Validates the `-tags=nessy` build on every PR so regressions in
    # the cmd/nessy / Ebiten coupling surface before release time.
    # darwin is the cheapest runner (no apt-get X11 deps), so we use
    # it as the canary; the release workflow exercises every platform
    # on tag.
    name: nessy tagged build (darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build nessy (-tags=nessy)
        run: go build -tags=nessy -o /tmp/nessy ./cmd/nessy

  klaus:
    name: klaus functional test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run Klaus 6502 functional test
        run: go test -tags=klaus -timeout 5m -run TestKlaus -v ./internal/cpu/...

  nestest:
    name: nestest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run nestest golden-PC walk
        run: go test -tags=nestest -timeout 5m -run TestNestest -v ./cmd/nessy/...

  dap-integration:
    name: dap integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run DAP end-to-end stdio session
        run: go test -tags=integration -race -timeout 2m -run TestIntegration -v ./internal/dap/...

  decimal:
    name: exhaustive BCD test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run exhaustive decimal-mode test (Bruce Clark Appendix B)
        run: go test -tags=decimal -timeout 2m -run TestDecimal -v ./internal/cpu/...

  perfgate:
    name: perf baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run perf gate
        run: go test -tags=perfgate -timeout 5m -run TestPerfGate -v ./internal/cpu/...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  vscode-ext:
    name: vscode extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/vscode-chippy
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/vscode-chippy/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests (xvfb for headless VS Code)
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build chippy.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /tmp/chippy.wasm ./cmd/chippy-wasm

  smoke:
    # VHS-driven smoke tests under test/smoke/. Each .tape script runs
    # chippy end-to-end through a real TTY (via ttyd) and renders a
    # GIF. CI only checks that vhs exited 0 — i.e. the tape didn't
    # crash mid-render. Reviewers scrub the artifact GIFs in PRs.
    # Skips nessy-* tapes here because the nessy build pulls in
    # X11 / GL dev headers (handled in the release workflow); chippy
    # tapes alone exercise the TUI and DAP-attach surfaces this job
    # exists to protect.
    name: vhs smoke (chippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install ttyd + ffmpeg (vhs deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # ttyd ships a static binary; apt's package is stale.
          curl -sSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo install -m 0755 /tmp/ttyd /usr/local/bin/ttyd
          ttyd --version

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@v0.11.0

      - name: Build chippy
        run: go build -o chippy ./cmd/chippy

      - name: Render smoke tapes
        run: make -C test/smoke chippy

      - name: Upload rendered GIFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chippy-smoke-gifs
          path: test/smoke/out/*.gif
          if-no-files-found: error

  cmos-e2e:
    name: cmos e2e demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cc65 toolchain
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build example/cmos_demo.bin
        run: make -C example cmos_demo.bin

      - name: Run CMOS demo end-to-end test
        env:
          CHIPPY_CMOS_E2E_STRICT: "1"
        run: go test -v -run TestCMOSDemo ./internal/cpu/...
