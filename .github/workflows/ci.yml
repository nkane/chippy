name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build ./...

      - name: go test
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  klaus:
    name: klaus functional test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run Klaus 6502 functional test
        run: go test -tags=klaus -timeout 5m -run TestKlaus -v ./internal/cpu/...

  dap-integration:
    name: dap integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run DAP end-to-end stdio session
        run: go test -tags=integration -race -timeout 2m -run TestIntegration -v ./internal/dap/...

  decimal:
    name: exhaustive BCD test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Run exhaustive decimal-mode test (Bruce Clark Appendix B)
        run: go test -tags=decimal -timeout 2m -run TestDecimal -v ./internal/cpu/...

  cmos-e2e:
    name: cmos e2e demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cc65 toolchain
        run: sudo apt-get update && sudo apt-get install -y cc65

      - name: Build example/cmos_demo.bin
        run: make -C example cmos_demo.bin

      - name: Run CMOS demo end-to-end test
        env:
          CHIPPY_CMOS_E2E_STRICT: "1"
        run: go test -v -run TestCMOSDemo ./internal/cpu/...
