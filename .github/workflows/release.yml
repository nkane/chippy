name: release

# Tag scheme:
#   vX.Y.Z → chippy release. Goreleaser flow: homebrew tap, AUR,
#            .deb / .rpm / .apk, VS Code marketplace, cosign
#            signatures, SPDX SBOMs.
#
# nessy carved out to github.com/nkane/nessy post-v1.2.0; its
# release workflow lives in that repo.
#
# See `docs/RELEASE.md` for the chippy release-cutting playbook.
on:
  push:
    tags:
      - 'v*'

# id-token: write lets cosign mint a keyless OIDC certificate bound to
# this workflow. contents: write is required for release-asset uploads.
permissions:
  contents: write
  id-token: write

jobs:
  # ----- chippy release (goreleaser flow) -----
  goreleaser:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.chippy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  vscode-extension:
    name: publish vscode-chippy
    needs: goreleaser
    runs-on: ubuntu-latest
    # Skip prereleases (rc / beta tags); marketplace can't unpublish a
    # released version. Only fires on stable chippy releases (bare
    # `vX.Y.Z` with no prerelease suffix).
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
    defaults:
      run:
        working-directory: extension/vscode-chippy
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/vscode-chippy/package-lock.json

      - name: Sync extension version to release tag
        # vsce refuses to publish if package.json's `version` is stale.
        # Strip the leading `v` from the git tag and write it.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version "$ver"

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Skip if version already on marketplace
        # vsce show errors when the extension isn't published. Use that
        # as the "needs publish" signal. If the listed version matches
        # the tag we want, we're done — idempotent retries don't
        # re-publish a stale build.
        id: market_check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set +e
          ver="${TAG#v}"
          installed=$(npx -y -p @vscode/vsce vsce show Hidden-Pixel.vscode-chippy --json 2>/dev/null | jq -r .versions[0].version 2>/dev/null)
          echo "installed=$installed target=$ver"
          if [ "$installed" = "$ver" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Hidden-Pixel.vscode-chippy v$ver already on the marketplace; skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code marketplace (with retry / backoff)
        if: steps.market_check.outputs.skip != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # Microsoft's marketplace API returns 'Concurrency'
          # rate-limit errors that can also mask real account-state
          # issues (delisted extension, suspended publisher, expired
          # PAT — see issue #215). Three attempts with 30s / 2min /
          # 5min backoff absorb transient throttles; anything beyond
          # that is investigation territory.
          set +e
          delays=(30 120 300)
          for attempt in 1 2 3; do
            echo "::group::vsce publish attempt $attempt"
            npx vsce publish --pat "$VSCE_PAT" --no-dependencies
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "::notice::vsce publish succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::vsce publish exhausted retries. If the error mentions 'Concurrency' / 'RequestBlockedException', see https://github.com/nkane/chippy/issues/215 for the manual-investigation playbook (publisher portal status, PAT validity)."
              exit "$rc"
            fi
            delay=${delays[$((attempt - 1))]}
            echo "::warning::vsce publish failed (rc=$rc); sleeping ${delay}s before retry"
            sleep "$delay"
          done

