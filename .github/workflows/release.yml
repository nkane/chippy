name: release

on:
  push:
    tags:
      - 'v*'

# id-token: write lets cosign mint a keyless OIDC certificate bound to
# this workflow. contents: write is required for the release-asset
# uploads goreleaser performs.
permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  vscode-extension:
    name: publish vscode-chippy
    needs: goreleaser
    runs-on: ubuntu-latest
    # Skip prereleases (rc / beta tags); marketplace can't unpublish a
    # released version. Tag a normal `vX.Y.Z` to ship.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    defaults:
      run:
        working-directory: extension/vscode-chippy
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/vscode-chippy/package-lock.json

      - name: Sync extension version to release tag
        # vsce refuses to publish if package.json's `version` is stale.
        # Strip the leading `v` from the git tag and write it.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version "$ver"

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Publish to VS Code marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "$VSCE_PAT" --no-dependencies
