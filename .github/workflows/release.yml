name: release

# Tag scheme:
#   vX.Y.Z → chippy release. Goreleaser flow: homebrew tap, AUR,
#            .deb / .rpm / .apk, VS Code marketplace, cosign
#            signatures, SPDX SBOMs.
#
# nessy carved out to github.com/nkane/nessy post-v1.2.0; its
# release workflow lives in that repo.
#
# See `docs/RELEASE.md` for the chippy release-cutting playbook.
on:
  push:
    tags:
      - 'v*'

# id-token: write lets cosign mint a keyless OIDC certificate bound to
# this workflow. contents: write is required for release-asset uploads.
permissions:
  contents: write
  id-token: write

jobs:
  # ----- chippy release (goreleaser flow) -----
  goreleaser:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.chippy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
