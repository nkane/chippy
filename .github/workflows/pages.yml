name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'cmd/chippy-wasm/**'
      - 'cmd/nessy-wasm/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize so a fast follow-up push doesn't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs site
        run: mkdocs build --strict --site-dir _site

      - name: Build chippy.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o web/chippy.wasm ./cmd/chippy-wasm

      - name: Build nessy.wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o web/nessy/nessy.wasm ./cmd/nessy-wasm

      - name: Refresh wasm_exec.js from the build toolchain
        run: |
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/nessy/wasm_exec.js

      - name: Nest the WASM playground under /playground/
        run: |
          mkdir -p _site/playground
          cp -r web/. _site/playground/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
